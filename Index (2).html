<title>USMLE Progress</title>
<style>/* ================= ТОКЕНЫ ================= */
:root{
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
  --bg:#F3F4F8; --card:#FFFFFF; --card2:#F6F7FB; --ink:#0B1220; --ink2:#394357; --muted:#5A6478; --faint:#626C82;
  --line:#E7EAF0; --grid:#EEF1F6;
  --blue:#2563EB; --green:#16A34A; --orange:#EA580C; --red:#DC2626; --amber:#C2740A; --violet:#7C3AED;
  --blue-s:#E8F0FE; --green-s:#E5F6EB; --orange-s:#FDEDE2; --red-s:#FCE9E9; --amber-s:#FCF1DC; --violet-s:#EFE9FD; --neutral-s:#EDF0F5;
  --c-young:#86D6A5; --c-susp:#B8C0CE; --c-buried:#D9DEE7;
  --side:#0F1A30; --side-ink:#A9BBD4;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
  --shadow2:0 12px 36px rgba(16,24,40,.14);
  --glass:rgba(255,255,255,.74); --glass-b:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.9);
  --r:22px; --r-s:16px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#080C16; --card:#111827; --card2:#172033; --ink:#EEF2FA; --ink2:#C5CDDC; --muted:#93A0B8; --faint:#8793AD;
  --line:#1F2A40; --grid:#1B2438;
  --blue:#6B9BFF; --green:#3DD68C; --orange:#FF9461; --red:#FF7272; --amber:#F6B94D; --violet:#A98BFF;
  --blue-s:rgba(107,155,255,.15); --green-s:rgba(61,214,140,.14); --orange-s:rgba(255,148,97,.15); --red-s:rgba(255,114,114,.15);
  --amber-s:rgba(246,185,77,.15); --violet-s:rgba(169,139,255,.15); --neutral-s:#1A2336;
  --c-young:#2E7D5B; --c-susp:#4A566E; --c-buried:#2B364D;
  --side:#0B1324; --side-ink:#8FA3C2;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.3);
  --shadow2:0 12px 36px rgba(0,0,0,.55);
  --glass:rgba(22,31,50,.72); --glass-b:rgba(255,255,255,.09); --glass-hi:rgba(255,255,255,.16);
}
/* ================= БАЗА ================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:calc(15px * var(--fz));line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.005em;
  transition:background .25s,color .25s}
.num,.kpi .v,.qt .n,.big,td,.mono{font-variant-numeric:tabular-nums}
b{font-weight:700}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
button{font-family:inherit;color:inherit}
.hide{display:none!important}
/* ================= КАРКАС ================= */
.app{display:flex;min-height:100vh}
.side{width:240px;flex-shrink:0;background:var(--side);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:24px 22px 18px;display:flex;align-items:center;gap:11px}
.brand .dot{width:34px;height:34px;border-radius:11px;background:linear-gradient(140deg,#3B82F6,#1D4ED8);
  display:flex;align-items:center;justify-content:center;font-size:calc(15px * var(--fz));font-weight:800;flex-shrink:0}
.brand h1{font-size:calc(15px * var(--fz));font-weight:800;letter-spacing:-.01em}
.brand span{display:block;font-size:calc(11.5px * var(--fz));letter-spacing:.16em;text-transform:uppercase;color:#6B82A3;margin-top:2px}
.nav{padding:8px 12px;flex:1;overflow-y:auto}
.nav .grp{font-size:calc(11.5px * var(--fz));letter-spacing:.14em;text-transform:uppercase;color:#56698A;padding:14px 10px 6px;font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:var(--side-ink);
  padding:10px 12px;border-radius:11px;font-size:calc(14px * var(--fz));font-weight:600;cursor:pointer;text-align:left;transition:.15s;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(59,130,246,.2);color:#fff}
.nav svg,.icon-btn svg{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav svg{width:17px;height:17px;flex-shrink:0}
.side-foot{padding:16px 18px;border-top:1px solid rgba(255,255,255,.08)}
.cd{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);border-radius:13px;padding:11px 13px}
.cd .n{font-size:calc(22px * var(--fz));font-weight:800;line-height:1}
.cd .t{font-size:calc(11.5px * var(--fz));color:#92A8C4;margin-top:3px}
.main{flex:1;min-width:0}
.topbar{padding:22px 30px 6px;display:flex;align-items:flex-start;gap:16px}
.topbar .hi{font-size:calc(13px * var(--fz));color:var(--muted);font-weight:600}
.topbar h2{font-size:calc(28px * var(--fz));font-weight:800;letter-spacing:-.03em;margin-top:2px;line-height:1.15}
.topbar .sub{font-size:calc(13px * var(--fz));color:var(--muted);margin-top:3px}
.ctl{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:2px}
.seg{display:inline-flex;background:var(--neutral-s);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:none;border-radius:8px;padding:6px 11px;font-size:calc(12.5px * var(--fz));font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.icon-btn{width:36px;height:36px;border-radius:11px;border:none;background:var(--neutral-s);color:var(--ink2);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--line)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}
.icon-btn.sm svg{width:15px;height:15px}
.icon-btn.danger{color:var(--red);background:var(--red-s)}
.icon-btn.armed{background:var(--red);color:#fff;width:auto;padding:0 10px;font-size:calc(12px * var(--fz));font-weight:700}
.wrap{padding:16px 30px 48px;max-width:1340px}
.cd-pill{display:inline-flex;align-items:baseline;gap:5px;background:var(--card);border-radius:999px;padding:6px 13px;box-shadow:var(--shadow);margin-top:8px}
.cd-pill b{font-size:calc(15px * var(--fz));font-weight:800}
.cd-pill span{font-size:calc(11.5px * var(--fz));color:var(--muted)}
@media(min-width:861px){.cd-pill{display:none!important}
}
/* ================= КАРТОЧКИ ================= */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;transition:background .25s}
.card-h{padding:17px 20px 12px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.card-h h3{font-size:calc(16px * var(--fz));font-weight:700;flex:1;letter-spacing:-.015em;min-width:0}
.card-h .note{font-size:calc(12.5px * var(--fz));color:var(--muted);font-weight:500}
.card-b{padding:0 20px 20px}
.card-b.pt{padding-top:4px}
.hint{font-size:calc(13px * var(--fz));color:var(--muted);line-height:1.6}
.pad{padding:0 20px 18px}
.ready{display:grid;grid-template-columns:186px 1fr;gap:26px;align-items:center;padding:4px 20px 22px}
.donut{position:relative;width:186px;height:186px}
.donut svg{display:block}
.donut circle{fill:none;stroke-width:17;stroke-linecap:butt;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.donut .bg{stroke:var(--neutral-s)}
.donut .a1{stroke:var(--blue)}
.donut .a2{stroke:var(--green)}
.donut .a3{stroke:var(--orange)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .mid b{font-size:calc(38px * var(--fz));font-weight:800;letter-spacing:-.05em;line-height:1}
.donut .mid i{font-size:calc(12px * var(--fz));font-style:normal;color:var(--muted);margin-top:2px;font-weight:600}
.legend-l{display:flex;flex-direction:column;gap:15px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:11px;align-items:center}
.lg .d{width:11px;height:11px;border-radius:50%}
.lg .nm{font-size:calc(14px * var(--fz));color:var(--ink2);font-weight:600}
.lg .vl{text-align:right}
.lg .vl b{font-size:calc(19px * var(--fz));font-weight:800;letter-spacing:-.02em}
.lg .vl span{font-size:calc(12.5px * var(--fz));color:var(--muted);margin-left:6px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 20px 20px;border-top:1px solid var(--line);margin-top:4px}
.mr .k{font-size:calc(12.5px * var(--fz));color:var(--muted);font-weight:600}
.mr .v{font-size:calc(23px * var(--fz));font-weight:800;letter-spacing:-.03em;margin-top:2px}
.mini-bar{height:5px;border-radius:3px;background:var(--neutral-s);margin-top:8px;overflow:hidden}
.mini-bar i{display:block;height:100%}
.rec{display:flex;gap:13px;padding:14px 20px;border-top:1px solid var(--line)}
.rec:first-child{border-top:none}
.rec .ic{width:36px;height:36px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:calc(17px * var(--fz))}
.rec .tx{flex:1;min-width:0}
.rec .tt{font-size:calc(14.5px * var(--fz));font-weight:700;letter-spacing:-.01em}
.rec .ds{font-size:calc(13px * var(--fz));color:var(--muted);margin-top:2px;line-height:1.5}
.tone-red{--tc:var(--red);--ts:var(--red-s)}
.tone-amber{--tc:var(--amber);--ts:var(--amber-s)}
.tone-green{--tc:var(--green);--ts:var(--green-s)}
.tone-blue{--tc:var(--blue);--ts:var(--blue-s)}
.tone-orange{--tc:var(--orange);--ts:var(--orange-s)}
.tone-muted{--tc:var(--muted);--ts:var(--neutral-s)}
.rec .ic{background:var(--ts)}
.rec .tt{color:var(--tc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r-s);padding:15px 17px;box-shadow:var(--shadow)}
.kpi .k{font-size:calc(12.5px * var(--fz));color:var(--muted);font-weight:600}
.kpi .v{font-size:calc(25px * var(--fz));font-weight:800;margin-top:4px;letter-spacing:-.04em;line-height:1.1}
.kpi .s{font-size:calc(12px * var(--fz));color:var(--muted);margin-top:3px}
.fcast{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.fc{background:var(--card);border-radius:var(--r-s);padding:16px 18px;box-shadow:var(--shadow)}
.fc .t{font-size:calc(11.5px * var(--fz));color:var(--muted);font-weight:700;letter-spacing:.06em}
.fc .big{font-size:calc(22px * var(--fz));font-weight:800;margin:8px 0 3px;letter-spacing:-.04em}
.fc .sub{font-size:calc(12.5px * var(--fz));color:var(--muted);line-height:1.55}
.fc .nt{font-size:calc(11.5px * var(--fz));color:var(--faint);margin-top:4px}
.pill{display:inline-block;margin-top:10px;padding:5px 11px;border-radius:9px;font-size:calc(12px * var(--fz));font-weight:700;background:var(--ts);color:var(--tc)}
.sect{display:flex;align-items:center;gap:11px;margin:22px 0 11px;padding:0 2px}
.sect h3{font-size:calc(18px * var(--fz));font-weight:800;letter-spacing:-.025em}
.sect .cnt{font-size:calc(12.5px * var(--fz));color:var(--muted);font-weight:600}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;border:none;background:var(--neutral-s);color:var(--ink2);border-radius:999px;padding:8px 15px;font-size:calc(13px * var(--fz));font-weight:700;cursor:pointer;transition:.15s}
.fchip.on{background:var(--ink);color:var(--card)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--card);border-radius:var(--r-s);padding:15px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.18s;position:relative}
.tile:active{transform:scale(.985)}
.tile:hover{box-shadow:var(--shadow2)}
.tile-top{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.tile-nm{flex:1;min-width:0;font-size:calc(14px * var(--fz));font-weight:700;letter-spacing:-.01em;line-height:1.25}
.ring-s{width:46px;height:46px;position:relative;flex-shrink:0}
.ring-s svg{display:block}
.ring-s circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring-s .bg{stroke:var(--neutral-s)}
.ring-s span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(11.5px * var(--fz));font-weight:800}
.tile-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:calc(12.5px * var(--fz));color:var(--muted);margin-top:5px}
.tile-row b{color:var(--ink2)}
.tag{display:inline-block;padding:3px 9px;border-radius:8px;font-size:calc(11.5px * var(--fz));font-weight:800;background:var(--ts);color:var(--tc)}
.chart-wrap{position:relative;height:280px;padding:0 2px}
.chart-sm{height:215px}
.chart-xs{height:170px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:calc(14px * var(--fz))}
th{text-align:left;font-size:calc(11.5px * var(--fz));text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 20px;white-space:nowrap}
td{padding:12px 20px;border-top:1px solid var(--line)}
tbody tr:hover td{background:var(--card2)}
.tw{overflow-x:auto}
.bar{height:6px;background:var(--neutral-s);border-radius:3px;overflow:hidden;min-width:80px;position:relative}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
/* ---------- формы ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;align-items:end;padding:0 20px 20px}
.form>div{min-width:0}
label{display:block;font-size:calc(12px * var(--fz));font-weight:600;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;min-width:0;max-width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:13px;
  font-size:calc(15px * var(--fz));font-family:inherit;background:var(--card2);color:var(--ink);outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--blue);background:var(--card);box-shadow:0 0 0 4px var(--blue-s)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:46px;text-align:left;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.55}
.inp-sm{padding:7px 10px;font-size:calc(14px * var(--fz));border-radius:10px;min-height:0!important}
.btn{border:none;border-radius:13px;padding:12px 20px;font-size:calc(15px * var(--fz));font-weight:700;cursor:pointer;transition:.15s}
.btn-p{background:var(--ink);color:var(--card)}
.btn-b{background:var(--blue);color:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:calc(12.5px * var(--fz));background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;word-break:break-all;user-select:all}
.page{display:none}
.page.on{display:block;animation:fade .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:calc(13.5px * var(--fz))}
/* ================= ANKI ================= */
.strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:calc(12.5px * var(--fz));color:var(--muted);margin:0 2px 12px}
.strip .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.strip.stale .dot{background:var(--amber)}
.queue{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qt{background:var(--card2);border-radius:18px;padding:14px 16px}
.qt .n{font-size:calc(32px * var(--fz));font-weight:800;letter-spacing:-.04em;line-height:1.05;color:var(--tc)}
.qt .l{font-size:calc(13px * var(--fz));font-weight:700;margin-top:5px;color:var(--tc)}
.qt .d{font-size:calc(12px * var(--fz));color:var(--muted);margin-top:2px}
.queue2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.qt.sm .n{font-size:calc(22px * var(--fz));color:var(--ink)}
.qt.sm .l{color:var(--ink2)}
.comp{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--neutral-s);gap:2px}
.comp i{display:block;height:100%;min-width:2px}
.comp-lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;margin-top:14px}
.cl{display:flex;align-items:center;gap:8px;font-size:calc(12.5px * var(--fz));color:var(--ink2)}
.cl i{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cl b{margin-left:auto;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:5px;max-width:520px}
.hc{aspect-ratio:1;border-radius:50%;background:var(--neutral-s)}
.hc.l1{background:var(--blue);opacity:.3}
.hc.l2{background:var(--blue);opacity:.55}
.hc.l3{background:var(--blue);opacity:.78}
.hc.l4{background:var(--blue)}
.hc.lf{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat-lg{display:flex;align-items:center;gap:6px;font-size:calc(11.5px * var(--fz));color:var(--muted);margin-top:12px}
.heat-lg .hc{width:12px;aspect-ratio:1}
.rt{display:grid;grid-template-columns:130px 1fr 78px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rt:first-child{border-top:none}
.rt .nm{font-size:calc(14px * var(--fz));font-weight:600}
.rt .sb{font-size:calc(11.5px * var(--fz));color:var(--muted);font-weight:500;display:block}
.rt .pv{text-align:right;font-size:calc(17px * var(--fz));font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar.tall{height:9px;min-width:0}
.bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35;border-radius:1px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.st{background:var(--card2);border-radius:14px;padding:12px 14px}
.st .k{font-size:calc(12px * var(--fz));color:var(--muted);font-weight:600}

.drawer{position:fixed;inset:0;background:rgba(5,9,20,.5);z-index:70;display:none;justify-content:flex-end;backdrop-filter:blur(3px)}

.grp-t{font-size:calc(12px * var(--fz));font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:18px 6px 8px}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;visibility:hidden;pointer-events:none;
  background:rgba(17,28,50,.96);color:#fff;padding:13px 22px;border-radius:15px;font-weight:600;font-size:calc(14px * var(--fz));z-index:99;
  transition:transform .32s cubic-bezier(.2,.9,.25,1),opacity .2s,visibility 0s .32s;box-shadow:0 12px 36px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;transition-delay:0s}
#toast.err{background:rgba(220,38,38,.96)}
#load{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;transition:opacity .4s}

.slw{display:flex;flex-direction:column;align-items:center;gap:18px;animation:slIn .45s ease-out both}
.slogo{width:92px;height:92px;display:block;filter:drop-shadow(0 10px 22px rgba(37,99,235,.35))}
.slogo .ring{transform-origin:60px 60px;animation:slSpin 2.2s linear infinite 1.2s}
.slogo .arc{stroke-dasharray:207.35;stroke-dashoffset:207.35;animation:slArc 1.1s cubic-bezier(.4,0,.2,1) .15s forwards}
.slogo .dot{transform-origin:60px 60px;transform:scale(0);animation:slDot .5s cubic-bezier(.34,1.56,.64,1) .35s forwards}
.slt{font-size:calc(12.5px * var(--fz));font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
@keyframes slIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes slArc{to{stroke-dashoffset:56}}
@keyframes slDot{to{transform:scale(1)}}
@keyframes slSpin{to{transform:rotate(360deg)}}
#refBtn svg{transition:transform .25s}

.plr{max-height:100dvh;overflow-y:auto;overscroll-behavior:contain}
.plr-p{padding:2px 16px 18px;border-top:1px solid var(--line)}
.pn-bar{display:flex;gap:8px;align-items:center;padding:12px 0 8px}
.pn-f{display:grid;gap:8px}
.pn-row{display:flex;gap:8px}
.pn-row input{width:120px;flex-shrink:0}
.pn-f textarea{resize:vertical;min-height:64px}
.pn-f label{font-size:calc(12px * var(--fz));font-weight:600;color:var(--muted)}
.pn-l{margin-top:14px}
.pn-lt{font-size:calc(11.5px * var(--fz));font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.pn-n{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.pn-n .tx{flex:1;font-size:calc(13.5px * var(--fz));line-height:1.45;white-space:pre-wrap;word-break:break-word}
#review{align-items:center;justify-content:center}
.rv{width:min(560px,100vw);background:var(--card);border-radius:22px;box-shadow:var(--shadow2);overflow:hidden;max-height:100dvh;display:flex;flex-direction:column}
.rv-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:700;color:var(--muted);font-size:calc(13px * var(--fz))}
.rv-b{padding:4px 20px 22px;overflow:auto}
.rv-card{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:10px 4px}
.rv-sys{font-size:calc(11.5px * var(--fz));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.rv-q{font-size:calc(21px * var(--fz));font-weight:700;line-height:1.35;letter-spacing:-.02em;white-space:pre-wrap;word-break:break-word}
.rv-sep{height:1px;background:var(--line);margin:18px 30px}
.rv-a{font-size:calc(18px * var(--fz));line-height:1.45;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.rv-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rvb{border:none;border-radius:14px;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;font-weight:700;font-size:calc(14px * var(--fz));transition:.12s}
.rvb small{font-size:calc(11.5px * var(--fz));font-weight:600;opacity:.8}
.rvb:active{transform:scale(.95)}
.rvb.g1{background:var(--red-s);color:var(--red)}
.rvb.g2{background:var(--orange-s);color:var(--orange)}
.rvb.g3{background:var(--green-s);color:var(--green)}
.rvb.g4{background:var(--blue-s);color:var(--blue)}
.rv-show{width:100%;margin-top:14px}
.rv-done{text-align:center;padding:36px 10px}
.rv-done .ok{width:64px;height:64px;border-radius:50%;background:var(--green-s);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:calc(30px * var(--fz));margin:0 auto 14px}
.rv-done .tt{font-size:calc(18px * var(--fz));font-weight:700;margin-bottom:16px}
.rv-line{display:flex;justify-content:space-between;align-items:center;gap:12px}
#expText{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:calc(12.5px * var(--fz));white-space:pre;resize:vertical;margin:10px 0}
@media(pointer:coarse){.icon-btn.sm{width:40px;height:40px}
.chip{padding:8px 14px}
.lnk{padding:8px 6px}
.info-btn{width:28px;height:28px}
}
@media(max-width:860px){.nrow,.crow{padding:13px 15px;gap:10px}
.lib-bar{padding:12px 14px}
.plr-p{padding:2px 14px 16px}
#review{align-items:flex-end}
.rv{width:100vw;border-radius:22px 22px 0 0}
.rv-q{font-size:calc(19px * var(--fz))}
.rv-a{font-size:calc(16.5px * var(--fz))}
.rvb{padding:14px 2px}
}
/* ================= ПОПРАВКИ ПО СКРИНШОТАМ ================= */
.cmp{gap:10px}
.cmp .kpi{padding:12px 15px;border-radius:16px}
.cmp .kpi .v{font-size:calc(21px * var(--fz));margin-top:2px}
.cmp .kpi .s:empty{display:none}
.chip.tm{width:62px;padding-left:0;padding-right:0;text-align:center}
.nrow .nact,.crow .nact{flex-direction:row;flex-wrap:wrap;gap:4px 16px;margin-top:6px;align-items:center}
.nrow .nact .lnk,.crow .nact .lnk{padding-left:0;padding-right:0}
.plr-f .btn{width:auto;white-space:nowrap}
.plr-f .hint{white-space:nowrap}
.vth{background-color:var(--blue-s);box-shadow:inset 0 0 0 1px var(--line)}
.card-h{flex-wrap:wrap;gap:2px 12px}
@media(max-width:860px){#info,#export{align-items:flex-end;justify-content:center}
#info .dr,#export .dr{width:100%;height:auto;max-height:86dvh;border-radius:22px 22px 0 0;animation:sheet .28s ease-out}
.plr-f{flex-wrap:wrap}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
/* шапка на телефоне: приветствие и кнопки в одной строке, заголовок — на всю ширину */
@media(max-width:860px){.topbar{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:center}
.topbar>div:first-child{display:contents}
.topbar .hi{grid-column:1;grid-row:1}
.topbar .ctl{grid-column:2;grid-row:1;margin-top:0}
.topbar h2{grid-column:1/-1;grid-row:2}
.topbar .sub{grid-column:1/-1;grid-row:3}
.topbar .cd-pill{grid-column:1/-1;grid-row:4;justify-self:start}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
/* ================= ДИЗАЙН v2: шкала шрифтов, меню, адаптация, иконки ================= */
:root{--fz:1;--hair:rgba(16,24,40,.05)}
:root[data-theme=dark]{--hair:rgba(255,255,255,.06)}
html{scrollbar-width:thin;scrollbar-color:rgba(100,116,139,.38) transparent}
:root[data-theme=dark]{scrollbar-color:rgba(148,163,184,.32) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,.34);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(100,116,139,.55);background-clip:content-box}
.nav{scrollbar-width:none;-ms-overflow-style:none}
.nav::-webkit-scrollbar{display:none}
.chips{scrollbar-width:none}
.card,.fc,.kpi{box-shadow:0 0 0 1px var(--hair),var(--shadow)}
/* боковое меню: помещается в любое окно, без полосы прокрутки */
.side{width:248px}
.brand{padding:22px 20px 14px}
.nav{padding:2px 12px 8px}
.nav button{min-height:40px;padding:9px 12px;gap:12px}
.nav .grp{padding:14px 12px 6px}
.side-foot{padding:12px 14px 16px}
.cd{display:flex;align-items:baseline;gap:10px;padding:11px 14px}
.cd .n{font-size:calc(24px * var(--fz))}
.cd .t{margin:0;line-height:1.2}
@media(min-width:861px) and (max-height:740px){.brand{padding:16px 18px 8px}
.nav .grp{padding:10px 12px 4px}
.nav button{min-height:36px;padding:7px 12px}
.side-foot{padding:8px 12px 12px}
.cd{padding:8px 12px}
}
@media(min-width:861px) and (max-height:620px){.nav .grp{padding:6px 12px 2px}
.nav button{min-height:32px;padding:5px 12px;margin-bottom:1px;gap:11px}
.brand{padding:10px 16px 4px}
.side-foot{padding:6px 12px 10px}
.cd{padding:6px 12px}
}
/* широкие экраны: содержимое не растягивается на весь монитор */
@media(min-width:861px){.topbar,.wrap{max-width:1240px;margin-left:auto;margin-right:auto;width:100%}
.ready{grid-template-columns:200px minmax(0,440px);justify-content:center;gap:56px}
}
/* иконки */
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.rec .ic{font-size:0;color:var(--tc)}
.rec .ic .ico{width:20px;height:20px}
.hub .ic{color:var(--blue);font-size:0}
.hub .ic .ico{width:21px;height:21px}
.nb{display:inline-flex;align-items:center;gap:3px}
.nb .ico{width:12px;height:12px;stroke-width:2.2}
.rv-done .ok .ico{width:30px;height:30px;stroke-width:2.2}
/* размер шрифта в настройках */
.fontbox{display:flex;align-items:center;gap:14px;margin:6px 0 6px}
.fontbox .fa-s,.fontbox .fa-l{font-weight:700;color:var(--muted);flex-shrink:0;line-height:1}
.fontbox .fa-s{font-size:14px}
.fontbox .fa-l{font-size:24px}
.fontbox input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:34px;background:none;padding:0;border:0;box-shadow:none}
.fontbox input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue) var(--p,50%),var(--neutral-s) var(--p,50%))}
.fontbox input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--neutral-s)}
.fontbox input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--blue)}
.fontbox input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.08);margin-top:-10px;box-shadow:0 2px 8px rgba(16,24,40,.28)}
.fontbox input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 8px rgba(16,24,40,.28)}
.fontbox input[type=range]:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:8px}
.fontrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fontrow .v{font-size:calc(13px * var(--fz));font-weight:700;color:var(--ink2)}
.fontprev{background:var(--neutral-s);border-radius:14px;padding:13px 15px}
.fontprev .ft{font-size:calc(12px * var(--fz));font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.fontprev .fs{font-size:calc(15px * var(--fz));line-height:1.5}
/* читаемость: тексты на тонированных плашках и кнопки — не ниже 4.5:1 */
:root:not([data-theme=dark]) .tone-red{--tc:#C01F1F}
:root:not([data-theme=dark]) .tone-green{--tc:#0F7A38}
:root:not([data-theme=dark]) .tone-amber{--tc:#94560A}
:root:not([data-theme=dark]) .tone-orange{--tc:#C2410C}
:root:not([data-theme=dark]) .tone-blue{--tc:#1D4ED8}
:root:not([data-theme=dark]) .tone-muted{--tc:#4F5A70}
:root:not([data-theme=dark]) .fc .nt.warn{color:#94560A}
.btn-b{background:#2563EB;color:#fff}
.chip.on{background:#2563EB;border-color:#2563EB;color:#fff}
/* видимый фокус с клавиатуры */
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}
/* ===== меню: заголовки разделов видны всегда, активный пункт отмечен ===== */
.nav .grp{display:flex;align-items:center;gap:10px}
.nav .grp::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
.nav button{position:relative}
.nav button.on{background:linear-gradient(90deg,rgba(59,130,246,.30),rgba(59,130,246,.12))}
.nav button.on::before{content:'';position:absolute;left:-12px;top:50%;width:4px;height:20px;margin-top:-10px;border-radius:0 4px 4px 0;background:#60A5FA}
@media(min-width:861px) and (max-height:500px){.nav{overflow-y:auto}
.nav .grp{padding:4px 12px 1px}
.nav button{min-height:30px;padding:4px 12px}
}
/* ===== главная: один столбец (телефон, узкое окно) — порядок блоков задаётся здесь ===== */
.mcols,.mcol{display:contents}
#p-map.on{display:flex;flex-direction:column}
/* широкий экран: два столбца — готовность, план и экзамен слева; рекомендации, фокус и карточки справа */
@media(min-width:1100px){#p-map.on{display:block}
.mcols{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:6px}
.mcol{display:block;min-width:0}
.mcols .card{margin-bottom:16px}
.mcols .ready{grid-template-columns:150px minmax(0,1fr);gap:22px;justify-content:stretch;padding:2px 22px 18px}
.mcols .donut,.mcols .donut svg{width:150px;height:150px}
.mcols .donut .mid b{font-size:calc(31px * var(--fz))}
.mcols .mrow{padding:14px 22px 20px}
}
/* телефон: крупные зоны нажатия (не меньше 40px), подписи ≥ 11px */
input,select,textarea{font-size:max(16px,calc(15px * var(--fz)))}
@media(pointer:coarse){input,select,textarea{font-size:max(16px,calc(16px * var(--fz)))}
.seg button{min-height:36px;padding:7px 14px}
.lnk{min-height:40px;display:inline-flex;align-items:center;padding:0 8px}
.fchip,.chips button{min-height:40px}
.inp-sm{min-height:40px!important}
.btn.sm{min-height:40px}
.info-btn{position:relative}
.info-btn::after{content:'';position:absolute;inset:-9px}
.chip{min-height:36px;display:inline-flex;align-items:center}
.chip.tm{min-height:36px}
input,select{min-height:44px}
}
@media(max-width:860px){.wrap{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:860px) and (orientation:landscape) and (max-height:500px){.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
/* ================= v5: ТЬЮТОР, СЕГОДНЯ, ОКНА, ПЛАНЕР, ПОКРЫТИЕ, ОШИБКИ, ФОКУС ================= */
#p-map.on #tutorCard{order:0}
#todayCard{order:2}
#readyCard{order:3}
#recsCard{order:4}
#wkCard{order:5}
#fcSect{order:6}
#fcast{order:7}
#examCard{order:8}
#focusCard{order:9}
#revCard{order:10}
#vidRecCard{order:11}
#chkCard{order:12}
#sysSect{order:13}
#sysChips{order:14}
#map{order:15}
#chartsRow{order:16}
#paceCard{order:17}
/* --- тьютор --- */
.tut{cursor:pointer;margin-bottom:14px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
.tut:hover{box-shadow:0 0 0 1px var(--hair),var(--shadow2)}
.tut:active{transform:scale(.995)}
.tut::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 150% at 0% 0%,rgba(59,130,246,.15),transparent 55%),radial-gradient(80% 120% at 100% 100%,rgba(16,185,129,.10),transparent 60%)}
.tut-in{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:'av main' 'msg msg' 'ach ach';gap:14px 18px;padding:18px 20px}
.tut-av{grid-area:av;position:relative;width:104px;height:104px;align-self:center}
.tav{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 16px rgba(37,99,235,.22))}
.tav .rg-bg{fill:none;stroke:var(--neutral-s);stroke-width:7}
.tav .rg-arc{fill:none;stroke:#3B82F6;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.tav .eye{animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tav .eye{transform-box:fill-box;transform-origin:center}
.tut-lvl{position:absolute;right:-2px;bottom:-2px;min-width:32px;height:32px;padding:0 7px;border-radius:16px;background:var(--ink);color:var(--card);font-weight:800;font-size:calc(14px * var(--fz));display:flex;align-items:center;justify-content:center;border:3px solid var(--card)}
.tut-main{grid-area:main;min-width:0}
.tut-name{font-size:calc(13px * var(--fz));color:var(--muted);font-weight:600}
.tut-rank{font-size:calc(24px * var(--fz));font-weight:800;letter-spacing:-.025em;line-height:1.15}
.tut-xp{display:flex;justify-content:space-between;gap:10px;margin:10px 0 6px;font-size:calc(12.5px * var(--fz));color:var(--muted);font-weight:600}
.tut-xp b{color:var(--ink);font-weight:800}
.xpbar{height:10px;border-radius:10px;background:var(--neutral-s);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#3B82F6,#10B981);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tut-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tchip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--neutral-s);font-size:calc(12.5px * var(--fz));font-weight:700;color:var(--ink2)}
.tchip .ico{width:14px;height:14px;stroke-width:2.2}
.tchip.fl{background:var(--orange-s);color:#C2410C}
.tchip.xp{background:var(--green-s);color:#0F7A38}
.tut-msg{grid-area:msg;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:calc(14px * var(--fz));line-height:1.45;color:var(--ink2);position:relative}
.tut-ach{grid-area:ach;display:flex;align-items:center;gap:10px;min-width:0}
.ach-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px 0}
.ach-row::-webkit-scrollbar{display:none}
.ach-b{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--blue-s);color:var(--blue)}
.ach-b .ico{width:17px;height:17px}
.ach-b.lock{background:var(--neutral-s);color:var(--faint)}
.ach-n{font-size:calc(12.5px * var(--fz));font-weight:700;color:var(--muted);white-space:nowrap}
/* --- «Сегодня» --- */
.td-ring{width:44px;height:44px;flex-shrink:0}
.td-ring .b{fill:none;stroke:var(--neutral-s);stroke-width:5}
.td-ring .a{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s}
.td-sum{display:flex;align-items:center;gap:12px;padding:0 17px 8px}
.td-sum .big{font-size:calc(22px * var(--fz));font-weight:800;line-height:1}
.td-sum .sm{font-size:calc(12.5px * var(--fz));color:var(--muted);font-weight:600}
.ti{display:flex;align-items:center;gap:12px;padding:11px 17px;border-top:1px solid var(--line);min-height:52px}
.cb{width:28px;height:28px;border-radius:10px;border:2px solid var(--faint);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;padding:0;color:#fff;transition:background .15s,border-color .15s,transform .12s}
.cb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.18s}
.cb[aria-checked=true]{background:var(--green);border-color:var(--green)}
.cb[aria-checked=true] svg{opacity:1;transform:none}
.cb:active{transform:scale(.9)}
.cb.ro{cursor:default;border-style:dashed;opacity:.75}
.ti .bd{flex:1;min-width:0}
.ti .tt{font-weight:600;font-size:calc(15px * var(--fz));overflow-wrap:anywhere}
.ti .mt{font-size:calc(12.5px * var(--fz));color:var(--muted);margin-top:1px}
.ti.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.ti .tm{font-variant-numeric:tabular-nums;font-weight:800;color:var(--blue);font-size:calc(13.5px * var(--fz));min-width:46px;text-align:right}
.ti .tg{display:inline-flex;align-items:center;gap:4px;font-size:calc(12px * var(--fz));font-weight:700;border-radius:999px;padding:2px 8px;background:var(--neutral-s);color:var(--ink2)}
.ti .tg .ico{width:12px;height:12px;stroke-width:2.4}
.ti .tg.fl{background:var(--orange-s);color:#C2410C}
.gbar{height:6px;border-radius:6px;background:var(--neutral-s);overflow:hidden;margin-top:6px}
.gbar i{display:block;height:100%;border-radius:6px;background:var(--blue);transition:width .5s}
.gbar.ok i{background:var(--green)}
.td-empty{padding:14px 17px 18px;color:var(--muted);font-size:calc(14px * var(--fz));line-height:1.5}
.td-add{display:flex;gap:8px;padding:12px 17px 6px;border-top:1px solid var(--line)}
.td-add input{flex:1;min-width:0}
.td-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 17px 14px;flex-wrap:wrap}
.td-note textarea{width:100%;min-height:84px;resize:vertical;margin-top:8px}
.btn-g{background:var(--neutral-s);color:var(--ink);font-weight:700}
.btn-g:hover{background:var(--line)}
#focusBtn{display:inline-flex;align-items:center;gap:6px}
#focusBtn .ico{width:15px;height:15px;stroke-width:2.2}
#focusBtn.run{background:var(--green-s);color:#0F7A38}
/* --- окно (лист) --- */
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,22,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:91;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--card);border-radius:26px 26px 0 0;display:flex;flex-direction:column;
  transform:translateY(104%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow2)}
.sheet.on{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 6px}
.sheet-h b{font-size:calc(18px * var(--fz));font-weight:800;letter-spacing:-.02em}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;padding:6px 20px 22px;-webkit-overflow-scrolling:touch}
.sheet-b label{display:block;font-size:calc(12.5px * var(--fz));font-weight:700;color:var(--muted);margin:14px 0 6px}
.sheet-b label:first-child{margin-top:4px}
.sheet-b input,.sheet-b select,.sheet-b textarea{width:100%}
.sheet-b textarea{min-height:84px;resize:vertical}
.sheet-act{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.sheet-act .btn{flex:1;min-width:120px}
.sheet-act .btn-r{background:var(--red-s);color:var(--red);flex:0 0 auto;min-width:0}
.sheet-hint{font-size:calc(12.5px * var(--fz));color:var(--muted);margin-top:6px;line-height:1.4}
@media(min-width:861px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(580px,92vw);max-height:86vh;border-radius:24px;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .28s}
.sheet.on{transform:translate(-50%,-50%);opacity:1;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s}
}
body.sheet-open{overflow:hidden}
/* --- общие элементы новых экранов --- */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill-b{border:0;cursor:pointer;padding:8px 13px;border-radius:12px;background:var(--neutral-s);color:var(--ink2);font-weight:700;font-size:calc(13.5px * var(--fz));min-width:44px;min-height:40px;transition:.15s}
.pill-b.on{background:#2563EB;color:#fff}
.pill-b.sm{min-width:0;padding:6px 11px;min-height:34px}
.syschips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.syschips .fchip{min-height:38px}
.syschips .fchip.on{background:#2563EB;color:#fff}
.brk-t{font-weight:800;margin-top:16px;font-size:calc(14px * var(--fz))}
.brk-d{font-size:calc(12.5px * var(--fz));color:var(--muted);margin:2px 0 10px;line-height:1.4}
.brk-r{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px;gap:8px;align-items:center;margin-bottom:8px}
.brk-r b{font-size:calc(13.5px * var(--fz));overflow-wrap:anywhere}
.empty-s{padding:18px 4px;color:var(--muted);font-size:calc(14px * var(--fz));line-height:1.5}
.sub-h{font-weight:800;font-size:calc(15px * var(--fz));margin:6px 0 10px}
/* --- планер: календарь --- */
.pl-cols{display:block}
@media(min-width:1100px){.pl-cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 17px 6px}
.cal-h b{font-size:calc(17px * var(--fz));font-weight:800;letter-spacing:-.02em}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav .icon-btn{width:40px;height:40px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:6px 12px 14px}
.cal .wd{text-align:center;font-size:calc(12px * var(--fz));font-weight:700;color:var(--muted);padding:6px 0}
.cd2{position:relative;min-height:50px;border:0;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink);font-weight:600;padding:4px 0;transition:background .12s}
.cd2:hover{background:var(--neutral-s)}
.cd2.out{color:var(--faint)}
.cd2.sel{background:var(--blue-s);box-shadow:inset 0 0 0 2px var(--blue)}
.cd2 .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(14px * var(--fz));font-variant-numeric:tabular-nums}
.cd2.today .n{background:#2563EB;color:#fff;font-weight:800}
.cd2 .dots{display:flex;gap:3px;height:6px;align-items:center}
.cd2 .dots i{width:6px;height:6px;border-radius:50%}
.dots .e{background:var(--blue)}
.dots .t{background:var(--amber)}
.dots .h{background:var(--green)}
.cd2.alld .dots i{opacity:.45}
.cd2 .nt{position:absolute;top:5px;right:7px;color:var(--muted)}
.cd2 .nt .ico{width:10px;height:10px}
.cal-leg{padding:0 17px 14px;color:var(--muted);font-size:calc(12px * var(--fz))}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 17px 8px}
.day-h b{font-size:calc(17px * var(--fz));font-weight:800;letter-spacing:-.02em}
.day-n{padding:0 17px 14px}
.day-n textarea{width:100%;min-height:72px;resize:vertical}
.row-act{display:flex;gap:4px;flex-shrink:0}
.row-act .icon-btn{width:36px;height:36px}
.row-act .icon-btn .ico{width:17px;height:17px}
/* --- привычки --- */
.hcard{padding:16px 17px;border-top:1px solid var(--line)}
.hcard:first-child{border-top:0}
.hcard .hh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hcard .ht{font-weight:800;font-size:calc(16px * var(--fz))}
.hcard .hd{font-size:calc(13px * var(--fz));color:var(--muted);margin-top:2px;line-height:1.4}
.hcard.off{opacity:.6}
.wdp{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.wdp span{min-width:40px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:calc(12.5px * var(--fz));font-weight:800;background:var(--neutral-s);color:var(--faint)}
.wdp span.sch{background:var(--blue-s);color:var(--blue)}
.wdp span.dn{background:var(--green);color:#fff}
.wdp span.tdy{box-shadow:0 0 0 2px var(--ink)}
.hstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* --- итоги недели --- */
.wk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;padding:0 17px 14px}
.wk-m{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.wk-m .l{font-size:calc(12px * var(--fz));color:var(--muted);font-weight:700}
.wk-m .v{font-size:calc(24px * var(--fz));font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.wk-m .d{font-size:calc(12px * var(--fz));font-weight:700;margin-top:2px}
.up{color:var(--green)}
.dn2{color:var(--red)}
.eq{color:var(--muted)}
.wk-l{padding:0 17px 14px}
.wk-l .it{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:calc(14px * var(--fz));line-height:1.45;color:var(--ink2)}
.wk-l .it:first-child{border-top:0}
.wk-l .it .ico{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.wk-l .it.g .ico{color:var(--green)}
.wk-l .it.a .ico{color:var(--amber)}
.wk-sum .big{font-size:calc(15px * var(--fz));line-height:1.5;padding:0 17px 14px;color:var(--ink2)}
/* --- покрытие --- */
.cov-top{display:flex;align-items:center;gap:16px;padding:18px 20px}
.cov-top .ring{width:84px;height:84px;flex-shrink:0;position:relative}
.cov-top .ring svg{width:100%;height:100%}
.cov-top .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(21px * var(--fz));font-weight:800}
.cov-top .tt{font-weight:800;font-size:calc(17px * var(--fz))}
.cov-top .ds{font-size:calc(13px * var(--fz));color:var(--muted);margin-top:3px;line-height:1.4}
.cov-note{padding:0 20px 16px;font-size:calc(12.5px * var(--fz));color:var(--muted);line-height:1.45}
.cov-sec{margin-bottom:10px;overflow:hidden}
.cov-sh{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 17px;cursor:pointer;color:inherit}
.cov-n{width:34px;height:34px;border-radius:11px;background:var(--neutral-s);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(14px * var(--fz));flex-shrink:0}
.cov-sec.done .cov-n{background:var(--green);color:#fff}
.cov-sec.prog .cov-n{background:var(--blue-s);color:var(--blue)}
.cov-sh .bd{flex:1;min-width:0}
.cov-sh .en{font-weight:700;font-size:calc(15px * var(--fz));line-height:1.3}
.cov-sh .ru{font-size:calc(12.5px * var(--fz));color:var(--muted)}
.cov-sh .pc{font-size:calc(13px * var(--fz));font-weight:800;color:var(--ink2);min-width:42px;text-align:right}
.cov-bar{height:6px;background:var(--neutral-s);border-radius:6px;margin-top:7px;overflow:hidden}
.cov-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3B82F6,#10B981);transition:width .5s}
.cov-auto{font-size:calc(12px * var(--fz));color:var(--muted);padding:0 17px 12px 63px;line-height:1.4}
.cov-subs{border-top:1px solid var(--line)}
.cov-sub{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 17px;cursor:pointer;color:inherit;min-height:48px}
.cov-sub:first-child{border-top:0}
.cov-sub:hover{background:var(--card2)}
.cov-st{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;color:#fff}
.cov-st .ico{width:14px;height:14px;stroke-width:3.2}
.cov-sub.prog .cov-st{border-color:var(--blue);background:linear-gradient(90deg,var(--blue) 50%,transparent 50%)}
.cov-sub.done .cov-st{border-color:var(--green);background:var(--green)}
.cov-sub .tt{font-weight:600;font-size:calc(14.5px * var(--fz));line-height:1.35}
.cov-sub .h{font-size:calc(12px * var(--fz));color:var(--muted);margin-top:2px;line-height:1.4}
.cov-sub .sl{font-size:calc(11.5px * var(--fz));font-weight:800;color:var(--muted);white-space:nowrap;margin-top:2px}
.cov-sub.prog .sl{color:var(--blue)}
.cov-sub.done .sl{color:var(--green)}
.cov-src{padding:6px 4px 18px;color:var(--faint);font-size:calc(12px * var(--fz));text-align:center}
/* --- журнал ошибок --- */
.er-f label{display:block;font-size:calc(12.5px * var(--fz));font-weight:700;color:var(--muted);margin:12px 0 6px}
.er-f label:first-child{margin-top:0}
.er-f input,.er-f select{width:100%}
.er-row{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.er-row:first-child{border-top:0}
.er-row .bd{flex:1;min-width:0}
.er-row .tt{font-weight:700;font-size:calc(14.5px * var(--fz));overflow-wrap:anywhere}
.er-row .mt{font-size:calc(12.5px * var(--fz));color:var(--muted);margin-top:2px;line-height:1.4;overflow-wrap:anywhere}
.er-rs{display:flex;flex-direction:column;gap:7px;margin:4px 0 12px}
.er-rb{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;font-size:calc(12.5px * var(--fz));color:var(--ink2);font-weight:600}
.er-rb .b{height:8px;background:var(--neutral-s);border-radius:8px;overflow:hidden}
.er-rb .b i{display:block;height:100%;background:var(--blue);border-radius:8px}
.er-rb span:last-child{text-align:right;font-weight:800}
.er-chip{display:inline-block;font-size:calc(11.5px * var(--fz));font-weight:800;padding:2px 9px;border-radius:999px;background:var(--neutral-s);color:var(--ink2)}
.er-chip.knowledge,.er-chip.recall{background:var(--red-s);color:#C01F1F}
.er-chip.misread,.er-chip.careless{background:var(--amber-s);color:#94560A}
.er-chip.guess,.er-chip.time{background:var(--blue-s);color:#1D4ED8}
/* --- фокус --- */
.ft-ring{width:210px;height:210px;margin:6px auto 4px;position:relative}
.ft-ring svg{width:100%;height:100%}
.ft-ring .b{fill:none;stroke:var(--neutral-s);stroke-width:12}
.ft-ring .a{fill:none;stroke:var(--blue);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ft-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ft-ring .c b{font-size:calc(42px * var(--fz));font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.ft-ring .c span{font-size:calc(13px * var(--fz));color:var(--muted);margin-top:6px;font-weight:600}
.ft-act{display:flex;gap:10px;margin-top:14px}
.ft-act .btn{flex:1}
.ft-stat{text-align:center;color:var(--muted);font-size:calc(13px * var(--fz));margin-top:12px}
/* --- уведомления / достижения в окне --- */
.ps-row{display:flex;align-items:flex-start;gap:12px;padding:14px 17px;border-top:1px solid var(--line)}
.ps-row:first-child{border-top:0}
.ps-row .ico{width:22px;height:22px;flex-shrink:0;margin-top:2px;color:var(--blue)}
.ps-row.warn .ico{color:var(--amber)}
.ps-row.ok .ico{color:var(--green)}
.ps-row .tt{font-weight:700;font-size:calc(14.5px * var(--fz))}
.ps-row .ds{font-size:calc(13px * var(--fz));color:var(--muted);margin-top:2px;line-height:1.45}
.ps-act{display:flex;gap:10px;padding:6px 17px 18px;flex-wrap:wrap}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.ag-i{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card2)}
.ag-i.got{background:var(--blue-s);border-color:transparent}
.ag-i .ico{width:22px;height:22px;color:var(--faint)}
.ag-i.got .ico{color:var(--blue)}
.ag-i .t{font-weight:800;font-size:calc(13.5px * var(--fz));margin-top:6px;line-height:1.25}
.ag-i .d{font-size:calc(12px * var(--fz));color:var(--muted);margin-top:2px;line-height:1.35}
.ag-i .gbar{margin-top:8px}
.xs-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:calc(14px * var(--fz))}
.xs-row:first-child{border-top:0}
.xs-row b{font-variant-numeric:tabular-nums}
@media(max-width:860px){.tut-in{grid-template-columns:auto minmax(0,1fr);padding:16px 16px;gap:12px 14px}
.tut-av{width:84px;height:84px}
.tut-lvl{min-width:28px;height:28px;font-size:calc(13px * var(--fz))}
.tut-rank{font-size:calc(21px * var(--fz))}
.brk-r{grid-template-columns:minmax(0,1fr) 72px 72px}
.er-rb{grid-template-columns:104px 1fr 26px}
.cal{padding:4px 8px 12px;gap:2px}
.cd2{min-height:46px}
.ft-ring{width:190px;height:190px}
}
@media(prefers-reduced-motion:reduce){.tav .eye{animation:none}
}

.btn .ico,.lnk .ico,.pill-b .ico,.mt .ico,.hd .ico,.tg .ico,.tchip .ico,.cal-leg .ico{display:inline-block;vertical-align:-3px}

}

.lg-d.t{background:var(--amber)}

/* ===== Библиотека: сводка, панель фильтров, строки ===== */
.lib-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:16px 4px;margin-bottom:12px}
.lib-stats .ls{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding:0 6px;text-align:center;border-left:1px solid var(--line)}
.lib-stats .ls:first-child{border-left:0}

:root{--amber-text:#9A5B05}

.tl-r{padding:10px 0;border-bottom:1px solid var(--line)}.tl-r:last-of-type{border-bottom:0}.tl-t{display:flex;justify-content:space-between;gap:8px;font-size:calc(13.5px * var(--fz));margin-bottom:8px}.tl-t span{color:var(--ink2);font-weight:600}.tl-t .muted{color:var(--muted)}
.tl-b{position:relative;height:12px;border-radius:7px;background:var(--neutral-s);margin:2px 6px 0}.tl-c{position:absolute;top:0;bottom:0;border-radius:7px;opacity:.28}.tl-p{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tl-x{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--red)}.tl-n{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--ink)}
.tl-s{margin-top:8px;font-size:calc(12.5px * var(--fz));font-weight:700}.tl-s.ok{color:var(--green-text,#0F7A38)}.tl-s.bad{color:#B91C1C}:root[data-theme=dark] .tl-s.bad{color:#FF8A8A}

.coll>.card-h{cursor:pointer;display:flex;align-items:center;gap:8px}.coll>.card-h::after{content:'';flex:0 0 auto;width:8px;height:8px;margin-left:auto;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}

function setLang(l) { LANG = (l === 'en') ? 'en' : 'ru'; }

function t(key) {
  var s = I18N[LANG] && I18N[LANG][key];
  if (s === undefined) s = I18N.ru[key];
  if (s === undefined) return key;
  for (var i = 1; i < arguments.length; i++) s = s.split('{' + (i - 1) + '}').join(String(arguments[i]));
  return s;
}

/* ---------- форматирование ---------- */
var MONTHS = {
  ru: ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'],
  en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
};
function fmtNum(n, dec) {
  n = Number(n); if (!isFinite(n)) n = 0;
  var k = (dec === undefined) ? 1 : dec, m = Math.pow(10, k);
  var r = Math.round(Math.abs(n) * m) / m;
  var parts = String(r).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'ru' ? '\u00A0' : ',');
  return (n < 0 && r !== 0 ? '-' : '') + parts.join(LANG === 'ru' ? ',' : '.');
}
function fmtInt(n) { return fmtNum(n, 0); }
function fmtPct(x) { return Math.round((Number(x) || 0) * 100) + '%'; }          // доля 0..1
function fmtPct1(p) { return (p === null || p === undefined) ? '—' : fmtNum(p, 1) + '%'; }   // уже в процентах
function fmtDate(s, withYear) {
  if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return '—';
  var y = +s.slice(0, 4), m = +s.slice(5, 7) - 1, d = +s.slice(8, 10);
  var mn = MONTHS[LANG][m];
  var base = LANG === 'ru' ? (d + ' ' + mn) : (mn + ' ' + d);
  return withYear ? base + ' ' + y : base;
}
function fmtDateTime(s) {
  if (!s) return '—';
  var d = fmtDate(String(s).slice(0, 10)), hm = String(s).slice(11, 16);
  return hm ? d + ', ' + hm : d;
}
function movingAvg(arr, w) {
  var out = [], sum = 0, i;
  for (i = 0; i < arr.length; i++) {
    sum += arr[i];
    if (i >= w) sum -= arr[i - w];
    out.push(Math.round(sum / Math.min(w, i + 1) * 10) / 10);
  }
  return out;
}
function errText(e) {
  var m = (e && e.message) ? String(e.message) : String(e || '');
  var mm = m.match(/E_([A-Z]+)/);
  if (mm && I18N.ru['err.' + mm[1]]) return t('err.' + mm[1]);
  return t('err.generic');
}

/* ---------- модель систем и готовности ---------- */
var SHORT = {'Biochemistry':'Biochem','Immunology':'Immuno','Microbiology':'Micro','General Pathology':'Path',
  'General Pharmacology':'Pharm','Public Health Sciences':'PubHealth','Cardiovascular':'Cardio','Endocrine':'Endo',
  'Gastrointestinal':'GI','Hematology & Oncology':'Heme/Onc','Musculoskeletal & Skin':'MSK/Skin',
  'Neurology & Special Senses':'Neuro','Psychiatry':'Psych','Renal':'Renal','Reproductive':'Repro','Respiratory':'Resp'};
function shortName(s) { return SHORT[s] || String(s).replace(' & ', '/'); }

function systemMap(D) {
  var by = {};
  D.uworld.bySystem.forEach(function (x) { by[x.system] = x; });
  return D.firstaid.rows.map(function (f) {
    var u = by[f.system] || { q: 0, c: 0, pct: 0 };
    var st = 'new';
    if (f.done > 0 || u.q > 0) st = 'prog';
    if (u.q >= 20 && u.pct < 0.55) st = 'weak';
    if (f.total > 0 && f.pct >= 0.95 && (u.q === 0 || u.pct >= 0.65)) st = 'done';
    return { system: f.system, total: f.total, done: f.done, left: f.left, pct: f.pct,
      uq: u.q, uc: u.c, upct: u.pct, status: st };
  });
}

function readiness(D) {
  var nb = D.nbme.filter(function (x) { return x.score > 0; });
  var last = nb.length ? nb[nb.length - 1] : null;
  var cover = D.uworld.total ? Math.min(1, D.uworld.questions / D.uworld.total) : 0;
  var uwPart = cover * (D.uworld.pct || 0);
  var nbPart = last ? Math.min(1, last.score / (D.settings.target_score || 240)) : 0;
  var fa = D.firstaid.pct || 0;
  var wNb = last ? 0.20 : 0, wFa = last ? 0.40 : 0.50, wUw = wFa;                                     // без пробника NBME его 20 % не «сгорают»: веса First Aid / UWorld по 50 %
  return { fa: fa, cover: cover, acc: D.uworld.pct || 0, uwPart: uwPart, nb: nbPart, last: last, noNbme: !last, w: { fa: wFa, uw: wUw, nb: wNb },
    ready: wFa * fa + wUw * uwPart + wNb * nbPart };
}

/* ---------- прогнозы (карточки) ---------- */
function buildForecastCards(D) {
  var f = D.forecast || {}, A = D.anki && D.anki.analysis, out = [], today = D.today;
  function pill(ok, behindTxt) { return ok ? { text: t('fc.ok'), tone: 'green' } : { text: behindTxt, tone: 'red' }; }
  function rawOr(k, rounded) { return (f.raw && f.raw[k] != null) ? f.raw[k] : rounded; }
  if (f.faLeft) {
    var pFa = rawOr('fa', f.pagesPerDay), okFa = (f.faNeed && pFa) ? pFa >= f.faNeed : null;
    out.push({ key: 'fa', title: t('fc.fa'), big: f.faProj ? fmtFinish(f.faProj.date, f.faProj.days, today) : t('fc.nopace'),
      sub: t('fc.sub', fmtInt(f.faLeft), t('u.pp'), fmtNum(f.pagesPerDay), f.faNeed ? t('fc.need', fmtInt(f.faNeed)) : ''),
      note: t('fc.window', f.windowFa), conf: f.conf && f.conf.fa, corr: corridorText(f.range && f.range.fa, today),
      extra: [slackText(f.slack && f.slack.fa), trendText(f.trend && f.trend.pages)].filter(Boolean),
      pill: okFa === null ? null : pill(okFa, t('fc.behind', Math.ceil(f.faNeed - pFa) + ' ' + t('u.pp'))) });
  }
  if (f.uwLeft) {
    var pUw = rawOr('uw', f.qPerDay), okUw = (f.uwNeed && pUw) ? pUw >= f.uwNeed : null;
    out.push({ key: 'uw', title: t('fc.uw'), big: f.uwProj ? fmtFinish(f.uwProj.date, f.uwProj.days, today) : t('fc.nopace'),
      sub: t('fc.sub', fmtInt(f.uwLeft), t('u.q'), fmtNum(f.qPerDay), f.uwNeed ? t('fc.need', fmtInt(f.uwNeed)) : ''),
      note: t('fc.window', f.windowUw), conf: f.conf && f.conf.uw, corr: corridorText(f.range && f.range.uw, today),
      extra: [slackText(f.slack && f.slack.uw), trendText(f.trend && f.trend.q)].filter(Boolean),
      pill: okUw === null ? null : pill(okUw, t('fc.behind', Math.ceil(f.uwNeed - pUw) + ' ' + t('u.q'))) });
  }
  if (A && A.finish && A.finish.remaining > 0) {
    var F = A.finish, N = f.ankiNote || {}, share = N.suspended > 0 ? Math.min(1, N.suspended / F.remaining) : 0;
    out.push({ key: 'anki', title: t('fc.anki'), big: F.date ? fmtFinish(F.date, F.days, today) : t('fc.nopace'),
      sub: t('fc.sub', fmtInt(F.remaining), t('u.cards'), fmtNum(F.perDay), F.need ? t('fc.need', fmtInt(F.need)) : ''),
      note: t('fc.window', 14), foot: share >= 0.5 ? t('fc.susp', Math.round(share * 100)) : '',
      extra: [slackText(f.slack && f.slack.anki), trendText(f.trend && f.trend.anki)].filter(Boolean),
      pill: F.ok === null ? null : pill(F.ok, t('fc.behind', Math.ceil(F.need - F.perDay) + ' ' + t('u.cards'))) });
  }
  if (f.nbme) {
    var tgt = D.settings.target_score, pr = f.nbme.projected;
    var sign = f.nbme.perWeek > 0 ? '+' : '';
    out.push({ key: 'nbme', title: t('fc.nbme'), big: pr ? String(pr) : '—',
      sub: t('fc.nbmeSub', sign + fmtNum(f.nbme.perWeek), tgt, f.nbme.points),
      note: f.nbme.low ? t('fc.lowConf') : '', conf: f.conf && f.conf.nbme,
      extra: (f.nbme.rangeLo != null) ? [t('fc.range', f.nbme.rangeLo, f.nbme.rangeHi)] : [],
      pill: pr ? (pr >= tgt ? { text: t('fc.onGoal'), tone: 'green' } : { text: t('fc.belowGoal', tgt - pr), tone: 'red' }) : null });
  }
  return out;
}

/* ---------- рекомендации (главная) ---------- */
function buildRecs(D) {
  var R = [], sm = systemMap(D), f = D.forecast || {}, A = D.anki && D.anki.analysis;
  var rd = readiness(D), acc = rd.acc;
  function add(p, ic, tone, title, desc) { R.push({ p: p, ic: ic, tone: tone, title: title, desc: desc }); }

  if (!D.settings.exam_date) add(0, 'calendar', 'blue', t('rec.noexam.t'), t('rec.noexam.d'));

  var weak = sm.filter(function (x) { return x.uq >= 20 && x.upct < 0.6; })
    .sort(function (a, b) { return a.upct - b.upct; });
  if (weak.length) {
    var w = weak[0];
    add(1, 'target', 'red', t('rec.weak.t', w.system),
      w.left > 0 ? t('rec.weak.d1', fmtPct(w.upct), w.uq, fmtInt(w.left)) : t('rec.weak.d2', fmtPct(w.upct), w.uq));
  }
  if (f.faLeft && f.faNeed) {
    if (!f.pagesPerDay) add(2, 'book', 'blue', t('rec.fastart.t'), t('rec.fastart.d', f.faNeed));
    else if (f.pagesPerDay < f.faNeed)
      add(2, 'book', 'amber', t('rec.fabehind.t'),
        t('rec.fabehind.d', fmtNum(f.pagesPerDay), f.faNeed, Math.ceil(f.faNeed - f.pagesPerDay), f.faProj ? fmtDate(f.faProj.date) : '—'));
    else add(8, 'check', 'green', t('rec.faok.t'), t('rec.faok.d', fmtNum(f.pagesPerDay), f.faProj ? fmtDate(f.faProj.date) : '—'));
  }
  if (f.uwLeft && f.uwNeed) {
    if (!f.qPerDay) add(3, 'help', 'blue', t('rec.uwstart.t'), t('rec.uwstart.d', f.uwNeed));
    else if (f.qPerDay < f.uwNeed) {
      var gap = Math.ceil(f.uwNeed - f.qPerDay);
      add(3, 'help', 'amber', t('rec.uwbehind.t'), t('rec.uwbehind.d', fmtInt(f.uwLeft), f.uwNeed, fmtNum(f.qPerDay), gap, Math.max(1, Math.ceil(gap / 40))));
    }
  }
  if (D.uworld.questions >= 100 && acc < 0.6) add(4, 'search', 'amber', t('rec.acc.t'), t('rec.acc.d', fmtPct(acc)));

  var last = D.anki && D.anki.last;
  var overdue = A && D.anki.meta && D.anki.meta.overdue != null ? D.anki.meta.overdue : (last ? last.cntOverdue : 0);
  if (overdue > 200) add(2, 'alert', 'red', t('rec.debt.t'), t('rec.debt.d', fmtInt(overdue)));
  if (A && A.finish && A.finish.ok === false)
    add(5, 'layers', 'amber', t('rec.ankipace.t'), t('rec.ankipace.d', fmtInt(A.finish.remaining), fmtNum(A.finish.perDay), A.finish.need));
  if (A && A.retention && A.retention.review.n >= 100 && A.retention.review.pct < 80)
    add(4, 'activity', 'amber', t('rec.ret.t', fmtPct1(A.retention.review.pct)), t('rec.ret.d'));

  if (f.nbme && f.nbme.projected) {
    var tg = D.settings.target_score, low = f.nbme.low ? t('rec.lowconf') : '';
    var sg = f.nbme.perWeek > 0 ? '+' : '';
    if (f.nbme.projected >= tg) add(7, 'trendup', 'green', t('rec.nbmeok.t'), t('rec.nbmeok.d', sg + fmtNum(f.nbme.perWeek), f.nbme.projected, tg) + low);
    else add(5, 'trenddown', 'red', t('rec.nbmebad.t'), t('rec.nbmebad.d', f.nbme.projected, tg, tg - f.nbme.projected) + low);
  }
  var fresh = sm.filter(function (x) { return x.status === 'new'; });
  if (fresh.length && D.days != null && D.days < 90)
    add(6, 'hourglass', 'blue', t('rec.fresh.t', fresh.length),
      t('rec.fresh.d', D.days, fresh.slice().sort(function (a, b) { return b.total - a.total; }).slice(0, 3).map(function (x) { return x.system; }).join(', ')));
  if (!R.length) add(9, 'check', 'green', t('rec.good.t'), t('rec.good.d'));
  R.sort(function (a, b) { return a.p - b.p; });
  return R.slice(0, 6);
}

/* ---------- выводы по Anki ---------- */
function ankiInsights(D) {
  var A = D.anki && D.anki.analysis, M = D.anki && D.anki.meta, R = [];
  if (!A || !A.hasDaily) return R;
  function add(p, ic, tone, title, desc) { R.push({ p: p, ic: ic, tone: tone, title: title, desc: desc }); }

  if (A.sync && A.sync.staleDays != null && A.sync.staleDays >= 2)
    add(0, 'clock', 'amber', t('ins.stale.t'), t('ins.stale.d', A.sync.staleDays));

function heatGrid(daily, ref, weeks) {

  var dow = (new Date(refUtc).getUTCDay() + 6) % 7;                 // пн = 0 … вс = 6
  var sunday = refUtc + (6 - dow) * 86400000;                       // воскресенье недели ref — последняя клетка
  var total = weeks * 7, cells = [];
  for (var idx = 0; idx < total; idx++) {
    var ms = sunday - (total - 1 - idx) * 86400000, dt = new Date(ms);
    var key = dt.getUTCFullYear() + '-' + ('0' + (dt.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + dt.getUTCDate()).slice(-2);
    var future = ms > refUtc, n = future ? 0 : (by[key] || 0);
    var lvl = future ? -1 : (n <= 0 ? 0 : (max ? Math.min(4, Math.ceil(n / max * 4)) : 0));
    cells.push({ d: key, n: n, lvl: lvl, col: Math.floor(idx / 7), row: idx % 7 });
  }
  return { cells: cells, max: max, weeks: weeks };
}

/* ---------- даты ---------- */
function utcMs(s) { var p = String(s).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function daysBetweenStr(a, b) { return Math.round((utcMs(b) - utcMs(a)) / 86400000); }
function weekdayOf(s) { var d = new Date(utcMs(s)).getUTCDay(); return d === 0 ? 7 : d; }          // Пн = 1 … Вс = 7
function mondayOf(s) { return addDaysStr(s, -(weekdayOf(s) - 1)); }
function monthGrid(ym) {                                                                           // 'YYYY-MM' → недели по 7 дней (с понедельника)
  var first = ym + '-01', start = mondayOf(first), p = ym.split('-'), last = new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate();
  var end = addDaysStr(ym + '-' + (last < 10 ? '0' : '') + last, 7 - weekdayOf(ym + '-' + (last < 10 ? '0' : '') + last));
  var weeks = [], d = start;
  while (d <= end) { var w = []; for (var i = 0; i < 7; i++) { w.push({ date: d, inMonth: d.slice(0, 7) === ym }); d = addDaysStr(d, 1); } weeks.push(w); }
  return weeks;
}
function shiftMonth(ym, k) { var p = ym.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1 + k, 1)); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2); }

/* ---------- привычки: расписание с постепенным ростом ---------- */
/** Сколько раз в неделю нужно делать привычку на неделе, в которую попадает дата: from + 1 за каждые `every` недель, но не больше to и числа выбранных дней. */
function habitTarget(h, dateStr) {
  var weeks = Math.floor(daysBetweenStr(mondayOf(h.start), mondayOf(dateStr)) / 7);
  if (weeks < 0) return 0;
  return Math.max(0, Math.min(h.to, h.days.length, h.from + Math.floor(weeks / h.every)));
}
/** Дни недели (1..7), на которые привычка запланирована на неделе с этой датой: первые N из выбранных дней, где N — цель недели. */
function habitWeekDays(h, dateStr) {
  var days = h.days.slice().sort(function (a, b) { return a - b; });
  if (mondayOf(dateStr) === mondayOf(h.start)) days = days.filter(function (d) { return d >= weekdayOf(h.start); });   // первая неделя: только дни, начиная со дня старта
  return days.slice(0, habitTarget(h, dateStr));
}

function habitStreak(h, hlog, today) {
  var set = {}; (hlog || []).forEach(function (l) { if (l.id === h.id) set[l.date] = 1; });
  var s = 0, d = today, g = 0;
  if (habitScheduledOn(h, d) && !set[d]) d = addDaysStr(d, -1);
  while (g++ < 500 && d >= h.start) { if (habitScheduledOn(h, d)) { if (set[d]) s++; else break; } d = addDaysStr(d, -1); }
  return s;
}

  var set = {}; (hlog || []).forEach(function (l) { if (l.id === h.id) set[l.date] = 1; });
  var best = 0, run = 0, d = h.start, g = 0;
  while (d <= today && g++ < 900) { if (habitScheduledOn(h, d)) { if (set[d]) { run++; if (run > best) best = run; } else if (d !== today) run = 0; } d = addDaysStr(d, 1); }
  return best;
}
function habitWeek(h, hlog, dateStr) {                                       // выполнено / цель на неделе
  var mon = mondayOf(dateStr), sun = addDaysStr(mon, 6), n = 0;
  (hlog || []).forEach(function (l) { if (l.id === h.id && l.date >= mon && l.date <= sun) n++; });
  return { done: n, target: habitWeekDays(h, dateStr).length };           // цель недели = число запланированных дней (в первой неделе их может быть меньше «цели»)
}

/* ---------- «Сегодня»: задачи, события, привычки и учебные нормы в одном списке ---------- */
function plannerOf(D) { return (D && D.planner) || { items: [], notes: [], habits: [], hlog: [], focus: [], errors: [], cov: [], push: {} }; }
function dayNoteOf(D, date) { var n = plannerOf(D).notes.filter(function (x) { return x.date === date; })[0]; return n ? n.text : ''; }
function buildToday(D, date) {
  date = date || D.today;
  var P = plannerOf(D), items = [];
  P.items.filter(function (x) { return x.date === date; })
    .sort(function (a, b) { var ta = a.time || '99:99', tb = b.time || '99:99'; return ta < tb ? -1 : ta > tb ? 1 : (a.title < b.title ? -1 : 1); })
    .forEach(function (x) { items.push({ type: x.kind === 'event' ? 'event' : 'task', id: x.id, title: x.title, time: x.time, remind: x.remind, note: x.note, done: !!x.done, p: x.done ? 1 : 0 }); });
  P.habits.filter(function (h) { return habitScheduledOn(h, date); }).forEach(function (h) {
    var dn = hlogHas(P.hlog, h.id, date); items.push({ type: 'habit', id: h.id, title: h.title, done: dn, p: dn ? 1 : 0, streak: habitStreak(h, P.hlog, D.today), week: habitWeek(h, P.hlog, date) });
  });
  var T = (date === D.today && D.forecast && D.forecast.today) || null;
  if (T) [['pages', 'plan.pages'], ['q', 'plan.q'], ['nw', 'plan.new'], ['vid', 'plan.vid']].forEach(function (g) {
    var o = T[g[0]]; if (o && o.goal) items.push({ type: 'goal', id: g[0], title: t(g[1]), done: o.done >= o.goal, p: Math.min(1, o.done / o.goal), value: o.done, goal: o.goal });
  });
  var done = items.filter(function (i) { return i.done; }).length, sum = items.reduce(function (a, i) { return a + i.p; }, 0);
  return { date: date, items: items, done: done, total: items.length, pct: items.length ? Math.round(sum / items.length * 100 + 1e-9) : null, note: dayNoteOf(D, date) };
}
/** Что отмечено на каждую дату месяца (для календаря): события, задачи, привычки, заметка. */
function dayMarks(D, date) {
  var P = plannerOf(D), its = P.items.filter(function (x) { return x.date === date; });
  var hs = P.habits.filter(function (h) { return habitScheduledOn(h, date); });
  return { events: its.filter(function (x) { return x.kind === 'event'; }).length, tasks: its.filter(function (x) { return x.kind !== 'event'; }).length, habits: hs.length,
    allDone: (its.length + hs.length) > 0 && its.every(function (x) { return !!x.done; }) && hs.every(function (h) { return hlogHas(P.hlog, h.id, date); }), note: !!dayNoteOf(D, date) };
}
function remindLabel(h) { return h ? t('pl.remind.h', h) : t('pl.remind.none'); }

/* ---------- тьютор: опыт, уровни, звания ---------- */
var XPR = { page: 2, q: 1, correct: 1, anki10: 1, newCard: 0.5, habit: 15, task: 10, focus5: 1, nbme: 100, error: 5, card: 5, videoMin: 0.3, video: 3, videoDay: 60 };      // видео: 0,3 XP за минуту длительности + 3 за каждое посмотренное
function levelStart(n) { return n <= 1 ? 0 : Math.round(150 * Math.pow(n - 1, 1.5)); }          // сколько всего опыта нужно, чтобы достичь уровня n
function levelOf(xp) { var n = 1; while (n < 99 && xp >= levelStart(n + 1)) n++; return n; }
function rankOf(level) { return level >= 30 ? 'professor' : level >= 25 ? 'chief' : level >= 20 ? 'attending' : level >= 15 ? 'fellow' : level >= 11 ? 'senior' : level >= 8 ? 'resident' : level >= 5 ? 'intern' : level >= 3 ? 'student' : 'rookie'; }
function activityDays(D) {                                                                       // дни с учёбой: страницы, вопросы, карточки Anki, фокус
  var s = {}, P = plannerOf(D);
  (D.logs || []).forEach(function (l) { if (l.pages > 0) s[l.date] = 1; });
  ((D.uworld && D.uworld.rows) || []).forEach(function (r) { if (r.q > 0) s[r.date] = 1; });
  ((D.anki && D.anki.daily) || []).forEach(function (a) { if (a.n > 0) s[a.d] = 1; });
  P.focus.forEach(function (f) { if (f.minutes > 0) s[f.date] = 1; });
  ((D.videos && D.videos.items) || []).forEach(function (v) { if (v.w) s[v.w] = 1; });                   // просмотренное видео — тоже учебный день
  return s;
}
function studyStreaks(D) {
  var s = activityDays(D), today = D.today, d = today, cur = 0, g = 0;
  if (!s[d]) d = addDaysStr(d, -1);
  while (s[d] && g++ < 900) { cur++; d = addDaysStr(d, -1); }
  var dates = Object.keys(s).sort(), best = 0, run = 0, prev = null;
  dates.forEach(function (x) { run = (prev && daysBetweenStr(prev, x) === 1) ? run + 1 : 1; if (run > best) best = run; prev = x; });
  return { current: cur, best: Math.max(best, cur), days: dates.length };
}
function tutorStats(D) {
  var days = {}, src = { pages: 0, uw: 0, anki: 0, habits: 0, tasks: 0, focus: 0, nbme: 0, errors: 0, cards: 0, video: 0 }, P = plannerOf(D);
  function add(date, key, v) { if (!date || !(v > 0)) return; days[date] = (days[date] || 0) + v; src[key] += v; }
  (D.logs || []).forEach(function (l) { add(l.date, 'pages', l.pages * XPR.page); });
  ((D.uworld && D.uworld.rows) || []).forEach(function (r) { add(r.date, 'uw', r.q * XPR.q + Math.min(r.correct, r.q) * XPR.correct); });
  ((D.anki && D.anki.daily) || []).forEach(function (a) { add(a.d, 'anki', Math.floor(a.n / 10) * XPR.anki10 + a.nw * XPR.newCard); });
  P.hlog.forEach(function (l) { add(l.date, 'habits', XPR.habit); });
  P.items.forEach(function (x) { if (x.done) add(x.done, 'tasks', XPR.task); });
  P.focus.forEach(function (f) { add(f.date, 'focus', Math.floor(f.minutes / 5) * XPR.focus5); });
  (D.nbme || []).forEach(function (n) { if (n.score > 0 && n.date) add(n.date, 'nbme', XPR.nbme); });
  P.errors.forEach(function (e) { add(e.date, 'errors', XPR.error); });
  ((D.library && D.library.cards) || []).forEach(function (c) { add(c.at, 'cards', XPR.card); });
  var vday = {};                                                                                          // прогресс видео: дата «просмотрено»; в день не больше XPR.videoDay (массовая отметка старых видео не даёт скачка)
  ((D.videos && D.videos.items) || []).forEach(function (v) { if (v.w) vday[v.w] = (vday[v.w] || 0) + (v.sec || 0) / 60 * XPR.videoMin + XPR.video; });
  Object.keys(vday).forEach(function (d) { add(d, 'video', Math.min(vday[d], XPR.videoDay)); });
  var xp = 0; Object.keys(days).forEach(function (k) { days[k] = Math.round(days[k]); xp += days[k]; });
  var level = levelOf(xp), start = levelStart(level), next = levelStart(level + 1), today = D.today, wk = 0;
  for (var i = 0; i < 7; i++) wk += days[addDaysStr(today, -i)] || 0;
  var sk = studyStreaks(D);
  return { xp: xp, level: level, rank: rankOf(level), start: start, next: next, into: xp - start, need: next - start, frac: (xp - start) / (next - start), toNext: next - xp,
    today: days[today] || 0, week: wk, bySource: src, byDay: days, streak: sk.current, bestStreak: sk.best, activeDays: sk.days };
}

/* ---------- достижения ---------- */

/** Прогноз уровней: темп XP/день — большее из «по завершённым дням» и «с сегодняшним» (окно до 14 дней с первого дня активности, как у остальных прогнозов). */
function levelForecast(D) {
  var st = tutorStats(D), today = D.today, byDay = st.byDay, ds = Object.keys(byDay).filter(function (d) { return d <= today && byDay[d] > 0; }).sort();
  var sum = function (a, b) { var s = 0; for (var d = a; d <= b; d = addDaysStr(d, 1)) s += byDay[d] || 0; return s; };
  var perDay = 0;
  if (ds.length) {
    var span = daysBetweenStr(ds[0], today), Wc = Math.max(1, Math.min(14, span)), Wi = Math.max(1, Math.min(14, span + 1));
    perDay = Math.max(sum(addDaysStr(today, -Wc), addDaysStr(today, -1)) / Wc, sum(addDaysStr(today, -(Wi - 1)), today) / Wi);
  }
  var up = []; for (var n = st.level + 1; n <= st.level + 3 && n <= 99; n++) { var need = levelStart(n) - st.xp; up.push({ level: n, xp: levelStart(n), left: need, days: perDay > 0 ? Math.ceil(need / perDay) : null }); }
  var days = D.days, exam = null;
  if (days != null && days >= 0) { var xpE = st.xp + perDay * days, lv = levelOf(Math.round(xpE)); exam = { days: days, xp: Math.round(xpE), level: lv, rank: rankOf(lv) }; }
  return { perDay: perDay, upcoming: up, exam: exam, xp: st.xp, level: st.level };
}

var WIDGET_TPL = "// USMLE Progress — виджет для Scriptable (экран блокировки и «Домой»): дни до экзамена, выполнение норм дня.\n// Установка: Scriptable → «+» → вставить код → назвать «USMLE». Затем добавить виджет Scriptable и выбрать этот скрипт.\nconst API = '__API__', KEY = '__KEY__', APP = '__APP__';\nconst fm = FileManager.local(), CACHE = fm.joinPath(fm.documentsDirectory(), 'usmle-cache.json');\nconst pad = n => String(n).padStart(2, '0');\nconst NAMES = { pages: 'First Aid', q: 'UWorld', nw: 'Anki new', vid: 'Видео' };\n\nasync function load() {\n  const d = new Date(), day = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());\n  try {\n    const r = new Request(API + '?widget=1&k=' + encodeURIComponent(KEY) + '&d=' + day); r.timeoutInterval = 20;\n    const j = await r.loadJSON();\n    if (j && j.ok) { fm.writeString(CACHE, JSON.stringify(j)); return j; }\n  } catch (e) { /* нет сети — покажем последнее сохранённое */ }\n  try { return JSON.parse(fm.readString(CACHE)); } catch (e) { return null; }\n}\nfunction bar(p, n) { const k = Math.max(0, Math.min(n, Math.round(p * n))); return '█'.repeat(k) + '░'.repeat(n - k); }\nfunction cut(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }\nfunction goalLine(g) { return NAMES[g.k] + ' ' + g.done + '/' + g.goal; }\n\nfunction build(j, fam) {\n  const w = new ListWidget(); w.url = APP || ''; w.refreshAfterDate = new Date(Date.now() + 15 * 60000); fam = fam || 'medium';\n  if (!j) { const t = w.addText('Нет данных'); t.font = Font.semiboldSystemFont(13); return w; }\n  const days = j.days == null ? '—' : String(j.days), pct = j.pct == null ? null : j.pct;\n  if (fam === 'accessoryInline') { const t = w.addText(days + ' дн · нормы ' + (pct == null ? '—' : pct + '%')); t.font = Font.semiboldSystemFont(13); return w; }\n  if (fam === 'accessoryCircular') { w.addAccessoryWidgetBackground = true; const t = w.addText(days); t.font = Font.boldSystemFont(20); t.centerAlign function ptrSet(py, spin, armed) {
  var ind = $('ptr'), m = scroller(); if (!ind || !m) return;
  ind.style.transform = 'translateY(' + (py - 56) + 'px) scale(' + (0.6 + Math.min(1, py / 54) * 0.4).toFixed(3) + ')'; ind.style.opacity = String(Math.min(1, py / 30));
  ind.classList.toggle('armed', !!armed); ind.classList.toggle('spin', !!spin);
  m.style.setProperty('--ptr', py.toFixed(1) + 'px');
}
function ptrReset() {
  var ind = $('ptr'), m = scroller(); if (!ind || !m) return;
  ind.classList.add('anim'); m.classList.add('ptr-anim'); ind.classList.remove('armed', 'spin'); ind.style.opacity = '0'; ind.style.transform = 'translateY(-64px)'; m.style.setProperty('--ptr', '0px');
  setTimeout(function () { ind.classList.remove('anim'); m.classList.remove('ptr-anim', 'ptr-on'); PTR.busy = false; PTR.active = false; }, 420);
}
function initPtr() {
  var m = document.querySelector('.main'), ind = $('ptr'); if (!m || !ind) return;
  m.addEventListener('touchstart', function (e) {
    if (!ptrAllowed(e) || e.touches.length !== 1) { PTR.start = false; return; }
    var t0 = e.touches[0]; PTR.y0 = t0.clientY; PTR.x0 = t0.clientX; PTR.py = 0; PTR.active = false; PTR.start = m.scrollTop <= 0;
  }, { passive: true });
  m.addEventListener('touchmove', function (e) {
    if (!PTR.start || PTR.busy) return;
    var t1 = e.touches[0], dy = t1.clientY - PTR.y0, dx = t1.clientX - PTR.x0;
    if (!PTR.active) {
      if (dy < -4 || Math.abs(dx) > 12 || m.scrollTop > 0) { PTR.start = false; return; }
      if (dy > 9 && dy > Math.abs(dx) * 1.2) { PTR.active = true; ind.classList.remove('anim'); m.classList.remove('ptr-anim'); m.classList.add('ptr-on'); } else return;
    }
    if (e.cancelable) e.preventDefault();                                     // нативная прокрутка/«резинка» не мешают
    PTR.py = 118 * (1 - Math.exp(-Math.max(0, dy) / 170));                    // сопротивление: чем дальше тянешь, тем туже
    ptrSet(PTR.py, false, PTR.py >= PTR.TH);
  }, { passive: false });
  function end() {
    if (!PTR.active) { PTR.start = false; return; }
    PTR.start = false; PTR.active = false;
    if (PTR.py >= PTR.TH) {
      PTR.busy = true; ind.classList.add('anim'); m.classList.add('ptr-anim'); ptrSet(58, true, true);
      refreshNow(true, function () { ptrReset(); });                          // обновить и вернуть страницу на место
    } else ptrReset();
  }
  m.addEventListener('touchend', end, { passive: true });
  m.addEventListener('touchcancel', end, { passive: true });
}
initPtr();

</script>
