<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USMLE Progress</title>
<meta name="theme-color" content="#F3F4F8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="USMLE">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{--bg:#F3F4F8;--card:#fff;--ink:#0B1220;--muted:#667085;--line:#E7EAF0;--blue:#2563EB;--red:#DC2626;--field:#F6F7FB}
  :root[data-theme=dark]{--bg:#080C16;--card:#111827;--ink:#EEF2FA;--muted:#93A0B8;--line:#1F2A40;--blue:#6B9BFF;--red:#FF7272;--field:#172033}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--ink);transition:background .25s,color .25s}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  #shell{position:fixed;inset:0;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);background:var(--bg)}
  #app{width:100%;height:100%;border:0;display:block;background:transparent}
  .panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg);z-index:10;overflow:auto}
  .panel.on{display:flex}
  .box{width:100%;max-width:440px;background:var(--card);border-radius:24px;padding:26px 22px;box-shadow:0 12px 36px rgba(16,24,40,.12)}
  .box h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
  .box p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
  input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;font-size:16px;font-family:inherit;background:var(--field);color:var(--ink);outline:none}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
  .btn{display:block;width:100%;margin-top:16px;padding:13px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--blue);margin-top:6px}
  .btn.red{background:transparent;color:var(--red);margin-top:4px;font-weight:600;font-size:13.5px}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
  .sep{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 0}
  #splash{flex-direction:column;text-align:center;transition:opacity .35s;z-index:20} #splash.out{opacity:0;pointer-events:none}
  .slw{display:flex;flex-direction:column;align-items:center;gap:18px;animation:slIn .45s ease-out both}
  .slogo{width:92px;height:92px;display:block;filter:drop-shadow(0 10px 22px rgba(37,99,235,.35))}
  .slogo .ring{transform-origin:60px 60px;animation:slSpin 2.2s linear infinite 1.2s}
  .slogo .arc{stroke-dasharray:207.35;stroke-dashoffset:207.35;animation:slArc 1.1s cubic-bezier(.4,0,.2,1) .15s forwards}
  .slogo .dot{transform-origin:60px 60px;transform:scale(0);animation:slDot .5s cubic-bezier(.34,1.56,.64,1) .35s forwards}
  .slt{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  @keyframes slIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  @keyframes slArc{to{stroke-dashoffset:56}}
  @keyframes slDot{to{transform:scale(1)}}
  @keyframes slSpin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
  .sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
  .sum div{background:var(--field);border-radius:14px;padding:11px 13px} .sum b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em} .sum span{font-size:12px;color:var(--muted)}
  .steps{margin:6px 0 4px 20px;color:var(--ink);font-size:14.5px;line-height:1.8}

  .toast.on{opacity:1;visibility:visible;transform:none}
  .ico{display:inline-block;width:18px;height:18px;vertical-align:-3px}
  .pushov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,12,22,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .pushov.on{display:flex}
  .pushc{background:var(--card,#fff);color:var(--ink,#0F172A);border-radius:24px;padding:26px 22px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  .pushc .pic{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .pushc .pic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .pushc h2{margin:0 0 8px;font-size:20px;letter-spacing:-.02em} .pushc p{margin:0 0 18px;color:var(--muted,#64748B);font-size:15px;line-height:1.5}
  .pbtn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;background:#2563EB;color:#fff;font-family:inherit;margin-top:8px;min-height:48px}
  .pbtn.ghost{background:transparent;color:var(--muted,#64748B)} .pbtn:disabled{opacity:.6;cursor:default}
</style>
</head>

    var u = LS(K_U), k = LS(K_K); if (!u || !k) return;

    try { ok = !!(navigator.sendBeacon && navigator.sendBeacon(u, new Blob([body], { type: 'text/plain;charset=UTF-8' }))); } catch (e) { }
    if (!ok) { try { fetch(u, { method: 'POST', mode: 'no-cors', keepalive: true, body: body }); } catch (e) { } }
  }
  function sendSub(sub) {
    var j = (sub && sub.toJSON) ? sub.toJSON() : sub; if (!j || !j.endpoint || !j.keys || !j.keys.p256dh || !j.keys.auth) return;
    postServer({ push: { endpoint: j.endpoint, keys: { p256dh: j.keys.p256dh, auth: j.keys.auth } }, ua: String(navigator.userAgent || '').slice(0, 80) });
  }
  function closePushAsk() { $('pushOv').classList.remove('on'); $('pGo').disabled = false; }
  function showPushAsk(pub) {
    if (pub && /^[A-Za-z0-9_-]{80,100}$/.test(pub)) { pushPub = pub; LS(K_P, pub); }
    if (!pushPub) pushPub = LS(K_P) || '';
    if (!pushSupported()) { toast(t('pUnsup')); return; }
    if (isIOS && !standalone) { toast(t('pPwa')); return; }
    if (!pushPub) { toast(t('pNoKey')); return; }
    $('pushOv').classList.add('on'); try { $('pGo').focus(); } catch (e) { }
  }
  function subscribePush() {
    $('pGo').disabled = true;
    var key = b64uToU8(pushPub);
    var perm; try { perm = Notification.requestPermission(); } catch (e) { perm = Promise.reject(e); }   // вызывается прямо при нажатии: иначе iPhone откажет
    Promise.resolve(perm).then(function (p) {
      if (p !== 'granted') throw 'denied';
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return reg.pushManager.getSubscription().then(function (sub) {
        if (sub && !sameKey(sub, key)) return sub.unsubscribe().then(function () { return null; });          // ключ сервера сменился — подписываемся заново
        return sub;
      }).then(function (sub) { return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }); });
    }).then(function (sub) { sendSub(sub); closePushAsk(); toast(t('pOk')); })
      .catch(function (e) { $('pGo').disabled = false; toast(t(e === 'denied' ? 'pDenied' : 'pErr')); });
  }
  function pushOff() {
    if (!pushSupported()) return;
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      if (!sub) return; var ep = sub.endpoint; return sub.unsubscribe().then(function () { postServer({ pushOff: { endpoint: ep } }); });
    }).then(function () { toast(t('pOff')); }).catch(function () { });
  }
  function syncPush() {                                                // раз за запуск подтверждаем серверу подписку (если он её потерял)
    if (pushSynced || !pushSupported() || typeof Notification === 'undefined' || Notification.permission !== 'granted') return; pushSynced = true;
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) { if (sub) sendSub(sub); }).catch(function () { });
  }
  $('pGo').addEventListener('click', subscribePush);
  $('pNo').addEventListener('click', closePushAsk);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePushAsk(); });

  /* ---------- сообщения от сайта ---------- */
  window.addEventListener('message', function (e) {
    if (!okOrigin(e.origin)) return;
    var d = e.data; if (!d || d.trf !== 1) return;
    if (d.type === 'trf-ready') { loaded = true; everLoaded = true; clearTimeout(readyTimer); hideSplash(); hide('slow'); syncPush(); }
    else if (d.type === 'trf-reload') loadApp(true);
    else if (d.type === 'trf-theme') applyTheme(d.theme, d.bg);
    else if (d.type === 'trf-prefs') { if (d.lang === 'en' || d.lang === 'ru') { lang = d.lang; LS(K_L, lang); applyLang(); } }
    else if (d.type === 'trf-summary' && d.s) LS(K_S, JSON.stringify({ at: Date.now(), s: d.s }));
    else if (d.type === 'trf-install') install();
    else if (d.type === 'trf-push-enable') showPushAsk(String(d.pub || ''));
    else if (d.type === 'trf-push-off') pushOff();
  });
  $('app').addEventListener('load', function () {                      // страница загрузилась, но «готов» мог не прийти (старая версия сайта)
    setTimeout(function () { if (!loaded) { loaded = true; everLoaded = true; clearTimeout(readyTimer); hideSplash(); } }, 2500);
  });

  /* ---------- установка ---------- */
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', function () { deferred = null; toast(t('installed')); });
  function install() {
    if (standalone) { toast(t('already')); return; }
    if (deferred) { var d = deferred; deferred = null; d.prompt(); if (d.userChoice && d.userChoice.then) d.userChoice.then(function () { }); return; }
    show(isIOS ? 'iosHelp' : 'genHelp');
  }
  $('iOk').addEventListener('click', function () { hide('iosHelp'); });
  $('gOk').addEventListener('click', function () { hide('genHelp'); });

  /* ---------- нет интернета ---------- */
  function showOffline() {
    var box = $('oSum'), raw = LS(K_S), data = null; try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    box.innerHTML = '';
    if (data && data.s) {
      var s = data.s, items = [[t('sumReady'), s.ready + '%'], [t('sumDays'), s.days == null ? '—' : s.days], [t('sumFa'), s.fa + '%'], [t('sumUw'), s.uw + '%'],
        [t('sumNb'), s.nbme == null ? '—' : s.nbme], [t('sumAnki'), s.ankiToday == null ? '—' : s.ankiToday]];
      items.forEach(function (it) { var d = document.createElement('div'), b = document.createElement('b'), sp = document.createElement('span'); b.textContent = it[1]; sp.textContent = it[0]; d.appendChild(b); d.appendChild(sp); box.appendChild(d); });
      var dt = new Date(data.at); $('oAt').textContent = t('oAt').replace('{0}', dt.toLocaleString(lang === 'en' ? 'en-GB' : 'ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }));
    } else { $('oAt').textContent = t('oNone'); }
    show('offline');
  }
  $('oRetry').addEventListener('click', function () { if (navigator.onLine === false) toast(t('oT')); else { hide('offline'); loadApp(); } });
  window.addEventListener('offline', showOffline);
  window.addEventListener('online', function () { if ($('offline').classList.contains('on')) { hide('offline'); loadApp(); } });

  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { } }
  start();
})();
</script>
