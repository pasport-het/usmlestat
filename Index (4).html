<style>

.sp{animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

function goPage(p) { S.page = p; ['now', 'today', 'words', 'more'].forEach(function (x) { $('p-' + x).classList.toggle('on', x === p); }); Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.dataset.go === p); }); $('main').scrollTop = 0; render(); }

}

var firstOk = false;

}
document.addEventListener('click', function (e) {

$('sheetBg').addEventListener('click', sheetClose); $('sheetX').addEventListener('click', sheetClose);
